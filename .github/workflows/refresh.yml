name: Refresh data and deploy dashboard

on:
  schedule:
    - cron: "15 6 * * *"   # 06:15 UTC daily — after markets/ECB have settled
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/**"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: pages-branch-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Ingest all sources
        working-directory: backend
        run: python ingest.py all --force
        env:
          PYTHONUNBUFFERED: "1"

      - name: Build static JSON snapshots
        working-directory: backend
        run: python export_static.py

      - name: Ensure .nojekyll
        run: touch frontend/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          publish_branch: gh-pages
          commit_message: "deploy: refresh data snapshot"
          force_orphan: true
